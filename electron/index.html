<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LottoPilot 数据监控</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 16px; color: #f8fafc; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #334155;
    }
    .card.stale { border-color: #f59e0b; background: #422006; }
    .card.addon-warn { border-color: #f97316; }
    .card .name { font-weight: 600; margin-bottom: 4px; font-size: 13px; }
    .card .date { font-size: 0.85rem; color: #94a3b8; }
    .card .days { font-size: 0.8rem; color: #64748b; }
    .card .exp { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    .card .badge { display: inline-block; margin-top: 6px; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
    .card .badge.ok { background: #065f46; color: #6ee7b7; }
    .card .badge.warn { background: #92400e; color: #fcd34d; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-check { background: #3b82f6; color: white; }
    .btn-update { background: #10b981; color: white; }
    .btn-update:disabled { background: #64748b; }
    .btn-loop { background: #334155; color: #e2e8f0; }
    .btn-loop.on { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }
    .log {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-family: Consolas, monospace;
      font-size: 0.75rem;
      max-height: 180px;
      overflow-y: auto;
    }
    .log .err { color: #f87171; }
    .log .ok { color: #6ee7b7; }
  </style>
</head>
<body>
  <h1>LottoPilot 数据监控</h1>
  <p style="font-size:12px;color:#64748b;margin:0 0 12px;">自动检查：每日 0:00（本机时间）；开启「自动更新」时，届时会先抓取再刷新状态。</p>
  <p style="font-size:11px;color:#94a3b8;margin:0 0 12px;line-height:1.45;">点「更新数据库」后约 <strong>1～3 分钟</strong>，下方日志会滚动显示抓取进度；完成后会自动刷新状态。详细日志：<code style="font-size:10px;">logs/monitor-scrape-last.log</code></p>
  <p style="font-size:11px;color:#94a3b8;margin:0 0 12px;line-height:1.45;"><strong>「更新完成」但仍显示需更新？</strong>说明库里<strong>最新开奖日仍早于</strong>上面推算的「应有」日期——常见原因：① 公开数据源（如 NY Open Data、WCLC）尚未公布该期；② 网络/地区抓取到的页面不是最新。可打开上述日志看是否出现 <code style="font-size:10px;">Upserted …</code> 及日期。美系彩种抓取已默认拉最近多期；若仍落后，多为源站数据延迟。</p>
  <div class="actions">
    <button class="btn-check" id="btnCheck" onclick="doCheck()">检查状态</button>
    <button class="btn-update" id="btnUpdate" onclick="doUpdate()">更新数据库</button>
    <button type="button" class="btn-loop" id="btnLoop" onclick="toggleAutoUpdate()">自动更新：关</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="log" id="log"></div>
  <script>
    var STORAGE_AUTO = 'monitorAutoUpdateOnSchedule';
    function getAutoUpdate() {
      try { return localStorage.getItem(STORAGE_AUTO) === 'true'; } catch (e) { return false; }
    }
    function setAutoUpdate(v) {
      try { localStorage.setItem(STORAGE_AUTO, v ? 'true' : 'false'); } catch (e) {}
      var el = document.getElementById('btnLoop');
      if (el) {
        el.textContent = v ? '自动更新：开' : '自动更新：关';
        el.classList.toggle('on', v);
      }
    }
    function toggleAutoUpdate() {
      var on = !getAutoUpdate();
      setAutoUpdate(on);
      log(on ? '已开启：每日 0:00 将自动更新数据库' : '已关闭：每日 0:00 仅检查状态');
    }
    function logRaw(msg, isErr) {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = isErr ? 'err' : 'ok';
      line.textContent = msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }
    function log(msg, isErr) {
      logRaw(new Date().toLocaleTimeString('zh-CN') + ' ' + msg, isErr);
    }
    function render(data) {
      const grid = document.getElementById('grid');
      const labels = data.labels || {};
      grid.innerHTML = (data.status || []).map(s => {
        const name = labels[s.lottery_id] || s.lottery_id;
        const date = s.latest_date || '-';
        const days = s.days_ago != null ? s.days_ago + ' 天前' : '-';
        const exp = s.expected_latest ? '<div class="exp">应有≥ ' + s.expected_latest + '</div>' : '';
        var bits = [];
        if (s.extra_ok != null) bits.push('EXTRA:' + (s.extra_ok ? '✓' : '缺'));
        if (s.encore_ok != null) bits.push('ENCORE:' + (s.encore_ok ? '✓' : '缺'));
        if (s.power_play_ok != null) bits.push('PowerPlay:' + (s.power_play_ok ? '✓' : '缺'));
        if (s.mega_multiplier_ok != null) bits.push('MegaMult:' + (s.mega_multiplier_ok ? '✓' : '缺'));
        const addon = bits.length ? '<div class="exp">' + bits.join(' · ') + '</div>' : '';
        const addonWarn = s.extra_ok === false || s.power_play_ok === false || s.mega_multiplier_ok === false;
        const badge = s.stale ? '<span class="badge warn">需更新</span>' : '<span class="badge ok">正常</span>';
        return '<div class="card' + (s.stale ? ' stale' : '') + (addonWarn ? ' addon-warn' : '') + '">' +
          '<div class="name">' + name + '</div>' +
          '<div class="date">' + date + '</div>' +
          '<div class="days">' + days + '</div>' + exp + addon + badge + '</div>';
      }).join('');
    }
    async function doCheck() {
      try {
        const data = await window.monitor.check();
        render(data);
        log('检查完成');
      } catch (e) {
        log('检查失败: ' + e.message, true);
      }
    }
    function pollScrapeUntilDone() {
      return new Promise(function (resolve, reject) {
        var n = 0;
        var maxN = 200;
        var lastTail = '';
        function tick() {
          n++;
          Promise.all([window.monitor.scrapeStatus(), window.monitor.scrapeLog()])
            .then(function (arr) {
              var st = arr[0];
              var tail = arr[1] || '';
              if (tail && tail !== lastTail) {
                lastTail = tail;
                var lines = tail.split('\n');
                var last = lines[lines.length - 1];
                if (last && !last.startsWith('===')) logRaw('  › ' + last);
              }
              if (!st.busy) resolve(st);
              else if (n >= maxN) resolve({ busy: false, lastError: null, timeout: true });
              else setTimeout(tick, 1500);
            })
            .catch(reject);
        }
        tick();
      });
    }
    async function doUpdate() {
      const btn = document.getElementById('btnUpdate');
      const btnCheck = document.getElementById('btnCheck');
      btn.disabled = true;
      if (btnCheck) btnCheck.disabled = true;
      log('正在启动抓取…');
      try {
        const started = await window.monitor.update();
        if (!started.started) {
          log(started.message || '已有抓取在运行', true);
          return;
        }
        log('抓取进行中（约 1～3 分钟），请稍候…');
        const st = await pollScrapeUntilDone();
        if (st.timeout) {
          log('等待超时。若仍在抓取，请稍后再点「检查状态」。', true);
        } else if (st.lastError) {
          log('更新失败: ' + st.lastError, true);
        } else {
          log('更新完成');
          await doCheck();
        }
      } catch (e) {
        log('更新失败: ' + e.message, true);
      }
      btn.disabled = false;
      if (btnCheck) btnCheck.disabled = false;
    }
    function scheduleNextMidnight() {
      const now = new Date();
      const next = new Date(now);
      next.setDate(next.getDate() + 1);
      next.setHours(0, 0, 0, 0);
      const delay = Math.max(60000, next.getTime() - now.getTime());
      setTimeout(async function () {
        try {
          if (getAutoUpdate()) {
            log('定时任务：自动更新数据库...');
            const started = await window.monitor.update();
            if (started.started) {
              const st = await pollScrapeUntilDone();
              if (st.lastError) log('定时任务失败: ' + st.lastError, true);
              else {
                log('定时任务：更新完成');
                await doCheck();
              }
            }
          } else {
            await doCheck();
          }
        } catch (e) {
          log('定时任务失败: ' + e.message, true);
        }
        scheduleNextMidnight();
      }, delay);
    }
    setAutoUpdate(getAutoUpdate());
    doCheck();
    scheduleNextMidnight();
  </script>
</body>
</html>
